name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release tag (for example deployment-20261008)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: aididalam
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned AMD64 and ARM64 images
        env:
          VERSION: ${{ inputs.version }}
        run: ./ops/deploy/publish.sh
