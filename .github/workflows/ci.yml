name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: TraceForge-Synthetic-CI-Password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pTraceForge-Synthetic-CI-Password"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            indexer/package-lock.json
            contracts/package-lock.json
            ui/package-lock.json

      - name: Verify submodule integrity
        shell: bash
        run: |
          set -euo pipefail
          status="$(git submodule status --recursive)"
          printf "%s\n" "$status"
          if printf "%s\n" "$status" | grep -Eq "^[+-U]"; then
            echo "Submodule checkout mismatch detected." >&2
            exit 1
          fi

      - name: Verify deployment configuration
        run: |
          node --test ops/deploy/config.test.mjs
          bash -n ops/deploy/traceforge.sh ops/deploy/install-timers.sh ops/deploy/publish.sh

      - name: Verify API
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm run verify:production-build
          npm run verify:security-hardening
          npm run verify:token-expiry
          npm run verify:public-discovery
          npm run verify:public-tracking
          npm run verify:public-presentation
          npm run verify:public-short-links
          npm run verify:operator-dashboard
          npm run verify:product-input
          npm run test:erp-input
          npm run verify:public-products
          npm run verify:provenance-schema
          npm audit --omit=dev --audit-level=high

      - name: Verify indexer
        working-directory: indexer
        run: |
          npm ci
          npm run typecheck
          npm run verify:production-build
          npm audit --omit=dev --audit-level=high

      - name: Verify public UI
        working-directory: ui
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TRACEFORGE_BROADCAST_ENABLED: "false"
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm audit --omit=dev --audit-level=high

      - name: Verify contracts
        working-directory: contracts
        run: |
          npm ci
          npm run compile
          node scripts/contract-report.mjs
          python3 ../ops/refresh-contract-abi.py --check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Verify assembled single and batch integration in real browsers
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "33306"
          MYSQL_USER: root
          MYSQL_PASSWORD: TraceForge-Synthetic-CI-Password
          TRACEFORGE_TEST_UI: "true"
        shell: bash
        run: |
          set -euo pipefail
          (cd contracts && npx hardhat node --network integration --hostname 127.0.0.1 --port 18545 > /tmp/traceforge-test-chain.log 2>&1) &
          test_chain_pid=$!
          trap 'kill "$test_chain_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:18545 >/dev/null; then break; fi
            sleep 1
          done
          cd api
          npm run test:direct-claim

      - name: Verify chain scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n chain/scripts/*.sh

      - name: Verify operational assets
        run: |
          node ops/verify-ops-assets.mjs
          node ops/verify-monitoring-assets.mjs
